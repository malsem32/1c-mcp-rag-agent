# Справка: язык запросов 1С (простой русский)
# Примеры — всегда ОДНОЙ строкой.
# Имена Документ.X / Справочник.Y / Регистр*.Z — ПЛЕЙСХОЛДЕРЫ.
# Подставляй только full_name и поля из find_metadata / get_object_structure ЭТОЙ базы.

синонимы_тем:
  обзор: обзор
  выбрать: выбрать
  из: из
  где: где
  даты: даты
  дата: даты
  представление: представление
  сумма: группировка
  группировка: группировка
  соединение: соединение
  регистр: регистры
  остатки: регистры
  срез: регистры
  срезпоследних: регистры
  оборот: регистры
  обороты: регистры
  остаткииобороты: регистры
  виртуальная: регистры
  ошибки: ошибки
  документ: документ
  справочник: справочник
  примеры: примеры
  одна_строка: одна_строка
  функции: функции
  function: функции
  functions: функции
  aggregate: функции
  агрегатные: функции
  антипаттерны: антипаттерны
  antipatterns: антипаттерны
  аудит: антипаттерны
  audit: антипаттерны
  best_practice: антипаттерны
  как_лучше: антипаттерны

разделы:
  обзор:
    заголовок: Обзор
    текст: >
      Язык запросов 1С (не как в других программах).
      Слова: ВЫБРАТЬ, ИЗ, ГДЕ, СГРУППИРОВАТЬ ПО, УПОРЯДОЧИТЬ ПО, ДАТАВРЕМЯ, ПРЕДСТАВЛЕНИЕ, ПЕРВЫЕ.
      Таблицы: Справочник.Имя, Документ.Имя, Документ.Имя.ИмяТЧ, РегистрСведений.Имя, РегистрНакопления.Имя.Остатки.
      Имена объектов и реквизитов — только из вашей базы (поиск и структура). Не копируй имена из примеров.
    пример: ВЫБРАТЬ ПЕРВЫЕ 10 Т.Наименование КАК Наименование ИЗ Справочник.<ИмяИзFindMetadata> КАК Т

  выбрать:
    заголовок: ВЫБРАТЬ
    текст: >
      ВЫБРАТЬ [РАЗРЕШЕННЫЕ] [РАЗЛИЧНЫЕ] [ПЕРВЫЕ N] Поле1 КАК Псевдоним1, Поле2 КАК Псевдоним2
      ИЗ Источник КАК Псевдоним [ГДЕ …] [СГРУППИРОВАТЬ ПО …] [УПОРЯДОЧИТЬ ПО … УБЫВ|ВОЗР].
      Всегда указывайте ПЕРВЫЕ N.
    пример: ВЫБРАТЬ ПЕРВЫЕ 20 Док.Номер КАК Номер, Док.Дата КАК Дата ИЗ Документ.<ИмяИзFindMetadata> КАК Док УПОРЯДОЧИТЬ ПО Док.Дата УБЫВ

  из:
    заголовок: ИЗ — откуда брать
    текст: >
      Справочник.Имя, Документ.Имя, Документ.Имя.ИмяТабличнойЧасти,
      РегистрСведений.Имя, РегистрНакопления.Имя.Остатки(...), РегистрНакопления.Имя.Обороты(...).
      Псевдоним: ИЗ Документ.X КАК Т — дальше Т.Поле. X — только из find_metadata.
    пример: ВЫБРАТЬ ПЕРВЫЕ 50 Стр.<ПолеТЧИзStructure> КАК Поле, Стр.<КолвоИзStructure> КАК Количество ИЗ Документ.<ИмяИзFindMetadata>.<ТЧИзStructure> КАК Стр

  где:
    заголовок: ГДЕ — отбор
    текст: >
      ГДЕ Условие. Операторы = <> < > <= >= , ПОДОБНО, В, МЕЖДУ, ЕСТЬ пусто.
      Логика: И, ИЛИ, НЕ. Строки в двойных кавычках. Булево: ИСТИНА / ЛОЖЬ.
    пример: ГДЕ Т.ПометкаУдаления = ЛОЖЬ И Т.Наименование ПОДОБНО "%текст%" И Т.Дата МЕЖДУ ДАТАВРЕМЯ(2015,1,1,0,0,0) И ДАТАВРЕМЯ(2015,12,31,23,59,59)

  даты:
    заголовок: Даты
    текст: >
      ДАТАВРЕМЯ(Год, Месяц, День, Час, Мин, Сек).
      Пример: ДАТАВРЕМЯ(2015, 2, 1, 0, 0, 0) … ДАТАВРЕМЯ(2015, 2, 28, 23, 59, 59).
      Док.Дата МЕЖДУ … И …
    пример: ГДЕ Док.Дата МЕЖДУ ДАТАВРЕМЯ(2015,1,1,0,0,0) И ДАТАВРЕМЯ(2015,1,31,23,59,59) И Док.Проведен = ИСТИНА

  представление:
    заголовок: ПРЕДСТАВЛЕНИЕ
    текст: >
      Для ссылочных полей (имя поля — из structure) в выборке: ПРЕДСТАВЛЕНИЕ(Т.<Поле>) КАК <Псевдоним>.
      В отборе сравнивают само поле: ГДЕ Т.<Поле> = &Параметр.
    пример: ВЫБРАТЬ ПЕРВЫЕ 10 Док.Номер КАК Номер, ПРЕДСТАВЛЕНИЕ(Док.<КонтрагентИзStructure>) КАК Контрагент, Док.<СуммаИзStructure> КАК Сумма ИЗ Документ.<ИмяИзFindMetadata> КАК Док

  группировка:
    заголовок: Суммы и группировка
    текст: >
      СУММА, КОЛИЧЕСТВО, СГРУППИРОВАТЬ ПО.
      Все поля без агрегата — в СГРУППИРОВАТЬ ПО.
    пример: ВЫБРАТЬ ПЕРВЫЕ 10 ПРЕДСТАВЛЕНИЕ(Док.<КонтрагентИзStructure>) КАК Контрагент, СУММА(Док.<СуммаИзStructure>) КАК Сумма, КОЛИЧЕСТВО(Док.Ссылка) КАК Количество ИЗ Документ.<ИмяИзFindMetadata> КАК Док ГДЕ Док.Проведен = ИСТИНА СГРУППИРОВАТЬ ПО Док.<КонтрагентИзStructure> УПОРЯДОЧИТЬ ПО Сумма УБЫВ

  соединение:
    заголовок: Соединения
    текст: >
      ЛЕВОЕ / ПРАВОЕ / ВНУТРЕННЕЕ СОЕДИНЕНИЕ … ПО …
      Часто шапка + табличная часть: Документ.X КАК Док ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.X.ТЧ КАК Стр ПО Док.Ссылка = Стр.Ссылка
      X и ТЧ — только из structure текущей базы.
    пример: ВЫБРАТЬ ПЕРВЫЕ 20 Док.Номер КАК Номер, ПРЕДСТАВЛЕНИЕ(Стр.<ПолеТЧИзStructure>) КАК Поле, Стр.<КолвоИзStructure> КАК Количество ИЗ Документ.<ИмяИзFindMetadata> КАК Док ВНУТРЕННЕЕ СОЕДИНЕНИЕ Документ.<ИмяИзFindMetadata>.<ТЧИзStructure> КАК Стр ПО Док.Ссылка = Стр.Ссылка ГДЕ Док.Проведен = ИСТИНА

  регистры:
    заголовок: Регистры
    текст: >
      Виртуальные таблицы регистров (параметры передавайте в скобках, отбор — условием внутри, а не в ГДЕ).
      РегистрСведений.Имя.СрезПоследних(&НаДату, Условие) — последнее значение на дату (цены, курсы);
      .СрезПервых(&НаДату, Условие) — первое значение после даты.
      РегистрНакопления.Имя.Остатки(&НаДату, Условие) — остатки на дату (вид регистра «Остатки»);
      .Обороты(&Начало, &Конец, Периодичность, Условие) — обороты за период;
      .ОстаткиИОбороты(&Начало, &Конец, Периодичность, МетодДополнения, Условие) — начальный остаток,
      приход, расход, конечный остаток за период (поля *НачальныйОстаток, *Приход, *Расход, *КонечныйОстаток).
      Остаток на дату внутри документа: &НаДату = Новый Граница(МоментВремени(), ВидГраницы.Исключая).
      Отбор по измерению ставьте в параметр «Условие» виртуальной таблицы — так быстрее, чем ГДЕ.
      Имена регистров, измерений и ресурсов — только из find_metadata + structure вашей базы.
    пример: ВЫБРАТЬ ПЕРВЫЕ 50 Ост.<ИзмерениеИзStructure> КАК Измерение, Ост.<РесурсИзStructure>Остаток КАК Остаток ИЗ РегистрНакопления.<ИмяИзFindMetadata>.Остатки(&Период, ) КАК Ост ГДЕ Ост.<РесурсИзStructure>Остаток <> 0

  документ:
    заголовок: Документы за период
    текст: >
      Список проведённых документов за месяц: отбор по Дате и Проведен = ИСТИНА.
      Имя документа и реквизитов — из поиска и структуры вашей базы.
    пример: ВЫБРАТЬ ПЕРВЫЕ 30 Док.Номер КАК Номер, Док.Дата КАК Дата, ПРЕДСТАВЛЕНИЕ(Док.<КонтрагентИзStructure>) КАК Контрагент, Док.<СуммаИзStructure> КАК Сумма ИЗ Документ.<ИмяИзFindMetadata> КАК Док ГДЕ Док.Дата МЕЖДУ ДАТАВРЕМЯ(2015,3,1,0,0,0) И ДАТАВРЕМЯ(2015,3,31,23,59,59) И Док.Проведен = ИСТИНА УПОРЯДОЧИТЬ ПО Док.Дата УБЫВ

  справочник:
    заголовок: Справочники
    текст: >
      ИЗ Справочник.Имя КАК Т. Не «Справочники.Имя».
      Отбор по наименованию: ПОДОБНО "%текст%". Имя — из find_metadata.
    пример: ВЫБРАТЬ ПЕРВЫЕ 20 Т.Код КАК Код, Т.Наименование КАК Наименование ИЗ Справочник.<ИмяИзFindMetadata> КАК Т ГДЕ Т.Наименование ПОДОБНО "%текст%" И Т.ПометкаУдаления = ЛОЖЬ

  ошибки:
    заголовок: Частые ошибки
    текст: >
      Не угадывать имя Документ.X — только из find_metadata.
      Не угадывать имена сумм/контрагентов — смотреть structure.
      Для ссылок в списке — ПРЕДСТАВЛЕНИЕ.
      Конец дня: 23,59,59.
      Строки в двойных кавычках.
      Не копировать имена из YAML/справки другой конфигурации.
    пример: хорошо — Справочник.<ИмяИзFindMetadata>, ПЕРВЫЕ 10, "текст" в двойных кавычках

  одна_строка:
    заголовок: Запрос одной строкой
    текст: >
      В параметр запроса передавайте весь ВЫБРАТЬ одной строкой, слова через пробел.
      Не разбивайте запрос на несколько строк.
    пример: ВЫБРАТЬ ПЕРВЫЕ 10 Т.Номер КАК Номер, Т.Дата КАК Дата ИЗ Документ.<ИмяИзFindMetadata> КАК Т УПОРЯДОЧИТЬ ПО Т.Дата УБЫВ

  примеры:
    заголовок: Примеры
    текст: >
      Смотрите также файл примеры_запросов (шаблоны с {{плейсхолдерами}}).
      Сначала найдите объект в базе, потом подставьте реквизиты из структуры.
    пример: ВЫБРАТЬ ПЕРВЫЕ 10 Т.Номер, Т.Дата ИЗ Документ.<ИмяИзFindMetadata> КАК Т

  функции:
    заголовок: Функции языка запросов (конструктор 1С)
    текст: >
      Полный каталог — knowledge/функции_запросов.yaml и query_syntax_help(functions).

      Агрегатные: СУММА, МИНИМУМ, МАКСИМУМ, СРЕДНЕЕ, КОЛИЧЕСТВО, КОЛИЧЕСТВО(РАЗЛИЧНЫЕ).
      Строки: СТРОКА, ДЛИНАСТРОКИ, ЛЕВ, ПРАВ, ВРЕГ, НРЕГ, ПОДСТРОКА, СОКРЛ, СОКРП, СОКРЛП,
      СТРНАЙТИ, СТРЗАМЕНИТЬ.
      Даты: ГОД, КВАРТАЛ, МЕСЯЦ, ДЕНЬГОДА, ДЕНЬ, НЕДЕЛЯ, ДЕНЬНЕДЕЛИ, ЧАС, МИНУТА, СЕКУНДА,
      НАЧАЛОПЕРИОДА, КОНЕЦПЕРИОДА, ДОБАВИТЬКДАТЕ, РАЗНОСТЬДАТ.
      Числа: ACOS…SQRT, ОКР, ЦЕЛ.
      Прочие: ЕСТЬNULL, ПРЕДСТАВЛЕНИЕ, ПРЕДСТАВЛЕНИЕССЫЛКИ, ТИПЗНАЧЕНИЯ, АВТОНОМЕРЗАПИСИ,
      РАЗМЕРХРАНИМЫХДАННЫХ, УНИКАЛЬНЫЙИДЕНТИФИКАТОР.
      Операторы: + − * / ; сравнение; И/ИЛИ/НЕ; ПОДОБНО; В; В ИЕРАРХИИ; МЕЖДУ; ЕСТЬ NULL; ССЫЛКА.
      Прочие операторы: ВЫБОР…КОНЕЦ, ВЫРАЗИТЬ.
      Конструкторы: ДАТАВРЕМЯ, ЗНАЧЕНИЕ, ТИП, СГРУППИРОВАНОПО.

      Для менеджерских отчётов чаще: ПРЕДСТАВЛЕНИЕ, ЕСТЬNULL, СУММА, КОЛИЧЕСТВО,
      НАЧАЛОПЕРИОДА, ГОД/МЕСЯЦ, МЕЖДУ, ДАТАВРЕМЯ, ВЫБОР.
    пример: ВЫБРАТЬ ПЕРВЫЕ 10 ПРЕДСТАВЛЕНИЕ(Т.<Поле>) КАК Поле, ЕСТЬNULL(Т.<Сумма>,0) КАК Сумма, НАЧАЛОПЕРИОДА(Т.Дата, МЕСЯЦ) КАК Мес, ВЫБОР КОГДА Т.<Сумма> > 0 ТОГДА "да" ИНАЧЕ "нет" КОНЕЦ КАК Флаг ИЗ Документ.<ИмяИзFindMetadata> КАК Т

  антипаттерны:
    заголовок: Антипаттерны запросов (аудит кода)
    текст: >
      Полный каталог и скан кода — knowledge/антипаттерны_запросов.yaml,
      tool audit_query_code, query_syntax_help(antipatterns).

      Нельзя / плохо: ВЫБРАТЬ *; запрос в цикле; склейка Запрос.Текст + данные;
      вложенный ВЫБРАТЬ вместо соединения; ANSI SELECT/JOIN; ПОДОБНО "%…%";
      ПРЕДСТАВЛЕНИЕ в ГДЕ; отбор ВТ только снаружи; DML в запросе;
      дата-строка без ДАТАВРЕМЯ; ДЛЯ ИЗМЕНЕНИЯ без нужды; сырой регистр вместо .Остатки/.Обороты.

      Как лучше: ПЕРВЫЕ N; явные поля; &параметры; отбор в параметрах виртуальной таблицы;
      соединения и ВТ; один запрос → обход выборки; ПРЕДСТАВЛЕНИЕ только в ВЫБРАТЬ;
      ЕСТЬNULL на ЛЕВОМ; СГРУППИРОВАТЬ ПО; имена таблиц/полей — только metadata этой CF.

      При аудите: findings (severity, path, line) + «Рекомендация (НЕ применено)».
    пример: audit_query_code(request="проверь запросы модуля проведения …") или query_syntax_help("antipatterns")
