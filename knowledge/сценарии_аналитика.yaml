# Сценарии аналитика 1С (универсально — без hardcode full_name)
# Фразы → mode analyst_report / compare_periods

сценарии:
  - id: assortment
    mode: assortment
    блок: "1. Ассортимент и спрос"
    фразы:
      - анализ ассортимента
      - что продаётся и что нет
      - хиты и неликвиды
      - бестселлеры
      - залежалый товар

  - id: reserves
    mode: reserves
    блок: "2. Скрытые резервы"
    фразы:
      - где заморожены деньги
      - скрытые резервы
      - заморозка оборотного капитала
      - склад и дебиторка

  - id: profit
    mode: profit
    блок: "3. Маржа и рост прибыли"
    фразы:
      - как заработать больше
      - маржинальность и рост прибыли
      - где низкая маржа
      - рост прибыли

  - id: customers
    mode: customers
    блок: "4. Клиентская аналитика"
    фразы:
      - клиентская аналитика
      - VIP и отток
      - работа с базой покупателей
      - кто не покупал
      - ушедшие клиенты

  - id: abc_counterparty
    mode: abc
    фразы:
      - ABC по контрагентам
      - авс анализ продаж
      - парето клиентов
    group_by: контрагент

  - id: variance_yoy
    mode: variance
    фразы:
      - кто дал рост
      - кто упал
      - вклад в прирост
      - за счёт кого выросли продажи

  - id: aging_ar
    mode: aging
    фразы:
      - просроченная задолженность
      - долги корзинами
      - aging дебиторка

  - id: drill_docs
    mode: drill
    фразы:
      - документы по
      - расшифруй
      - детализация по контрагенту

  - id: plan_fact
    mode: plan_fact
    фразы:
      - план-факт
      - план vs факт

  - id: turnover
    mode: turnover
    фразы:
      - оборачиваемость
      - дней запаса

  - id: funnel
    mode: funnel
    фразы:
      - воронка продаж
      - заказы без отгрузки

  - id: anomaly
    mode: anomaly
    фразы:
      - аномалии продаж
      - падение больше 50%

  - id: excel_dashboard
    mode: dashboard
    to_excel: true
    фразы:
      - красивый отчёт в excel
      - выгрузка с графиками
      - дашборд продаж

excel:
  when:
    - excel
    - xlsx
    - график
    - диаграмм
    - красивый отчёт
  format: multi_sheet_charts
  sheets:
    - Сводка (bullets)
    - Итоги (bar)
    - Рост / Падение
    - Данные / ABC / Корзины
