# Антипаттерны языка запросов 1С + как лучше.
# Платформенные правила (не имена CF). Имена Документ.X / полей — только из metadata.
# Используется: audit_query_code, query_syntax_help(topic=antipatterns), inspect_code (аудит).

версия: 1
источник: "Практика запросов 1С / аудит кода (универсально)"

# --- Как агент должен отвечать при аудите ---
правила_ответа:
  - "Только факты: path, line, id антипаттерна, severity, фрагмент."
  - "Рекомендация BSL/ВЫБРАТЬ — с заголовком «Рекомендация (НЕ применено, CF не менялась)»."
  - "Не выдумывать full_name таблиц: в примере <ИмяИзFindMetadata> / поля из structure."
  - "READ-ONLY: не «я исправил» / «уже оптимизировано»."
  - "Запрос в цикле — high; SELECT * без ПЕРВЫЕ — medium/high; вложенный ВЫБРАТЬ — medium."

# --- Сводка «как писать хорошо» (для LLM) ---
как_лучше:
  - "ПЕРВЫЕ N на списках; явные поля, не *."
  - "Параметры &Имя + УстановитьПараметр; даты через ДАТАВРЕМЯ / &Начало &Конец."
  - "Отбор виртуальной таблицы — во 2-м параметре Остатки/Обороты/Срез, не только снаружи ГДЕ."
  - "Соединения вместо вложенных ВЫБРАТЬ; временные таблицы для многошаговых расчётов."
  - "Запрос вне цикла: один раз Выполнить → Выгрузить/Выбрать; в цикле — только обход выборки."
  - "ПРЕДСТАВЛЕНИЕ в выборке; в ГДЕ сравнивать ссылку, не представление."
  - "ЕСТЬNULL на левых соединениях; СГРУППИРОВАТЬ ПО для всех неагрегатных полей."
  - "РАЗРЕШЕННЫЕ, если нужны RLS; не склеивать текст запроса из ввода пользователя."

# --- Каталог: detect = regex (case-insensitive, re.I | re.M) ---
# match_scope: query | bsl | both  (query = текст ВЫБРАТЬ; bsl = модуль с Запрос/циклами)
антипаттерны:
  - id: select_star
    severity: high
    title: "ВЫБРАТЬ * (все поля)"
    match_scope: query
    detect:
      - '(?i)ВЫБРАТЬ\s+(?:РАЗРЕШЕННЫЕ\s+)?(?:РАЗЛИЧНЫЕ\s+)?(?:ПЕРВЫЕ\s+\d+\s+)?\*'
      - '(?i)\bSELECT\s+(?:TOP\s+\d+\s+)?\*'
    плохо: "ВЫБРАТЬ * ИЗ Документ.<Имя> КАК Т"
    лучше: "ВЫБРАТЬ ПЕРВЫЕ 100 Т.Ссылка, Т.Дата, Т.<ПолеИзStructure> ИЗ Документ.<Имя> КАК Т"
    почему: "Лишние поля, сеть, память; ломается при новых реквизитах."
    рекомендация: "Перечислить нужные поля; для списков — ПЕРВЫЕ N."

  - id: no_first_on_list
    severity: medium
    title: "Список без ПЕРВЫЕ (возможен полный скан)"
    match_scope: query
    # эвристика: есть ВЫБРАТЬ и ИЗ Документ/Справочник, нет ПЕРВЫЕ, нет СУММА/СГРУППИРОВАТЬ/ИТОГИ
    detect_all:
      - '(?i)\bВЫБРАТЬ\b'
      - '(?i)\bИЗ\s+(Документ|Справочник|Document|Catalog)\.'
    detect_none:
      - '(?i)\bПЕРВЫЕ\s+\d+'
      - '(?i)\bСУММА\s*\('
      - '(?i)\bСГРУППИРОВАТЬ\s+ПО\b'
      - '(?i)\bИТОГИ\b'
      - '(?i)\bКОЛИЧЕСТВО\s*\('
    плохо: "ВЫБРАТЬ Т.Ссылка, Т.Дата ИЗ Документ.<Имя> КАК Т ГДЕ …"
    лучше: "ВЫБРАТЬ ПЕРВЫЕ 500 Т.Ссылка, Т.Дата ИЗ Документ.<Имя> КАК Т ГДЕ … УПОРЯДОЧИТЬ ПО Т.Дата УБЫВ"
    почему: "Без лимита выборка может вытянуть всю таблицу."
    рекомендация: "Добавить ПЕРВЫЕ N или явно агрегировать (СУММА + СГРУППИРОВАТЬ)."

  - id: nested_select
    severity: medium
    title: "Вложенный ВЫБРАТЬ (подзапрос)"
    match_scope: query
    detect:
      - '(?i)\(\s*ВЫБРАТЬ\b'
      - '(?i)\bВ\s*\(\s*ВЫБРАТЬ\b'
    плохо: "ГДЕ Т.Ссылка В (ВЫБРАТЬ … ИЗ …)"
    лучше: "ВНУТРЕННЕЕ СОЕДИНЕНИЕ … ПО … или ВТ + соединение; для остатков — виртуальная таблица"
    почему: "Часто хуже плана; сложнее читать; в 1С предпочтительны соединения и ВТ."
    рекомендация: "Переписать на СОЕДИНЕНИЕ или временную таблицу; не копировать ANSI-подзапросы."

  - id: query_in_loop
    severity: high
    title: "Запрос внутри цикла"
    match_scope: bsl
    # детект: эвристика в Python (near loop + Новый Запрос / .Выполнить)
    detect_code: query_in_loop
    плохо: "Для Каждого Стр Из … Цикл Запрос = Новый Запрос; … Запрос.Выполнить(); КонецЦикла;"
    лучше: "Один Запрос с параметром В (&Список) или ВТ; в цикле — только обход Выборка/ТаблицаЗначений"
    почему: "N+1 запросов к СУБД; главный источник тормозов."
    рекомендация: "Собрать ключи → один пакетный запрос → соответствие в памяти."

  - id: concat_query_text
    severity: high
    title: "Склейка текста запроса (+ / СтрШаблон из данных)"
    match_scope: bsl
    detect:
      - '(?i)Запрос\s*\.\s*Текст\s*=\s*[^;\n]*\+'
      - '(?i)Запрос\s*\.\s*Текст\s*=\s*СтрШаблон\s*\('
      - '(?i)\.Текст\s*=\s*СтрШаблон\s*\('
    плохо: 'Запрос.Текст = "ВЫБРАТЬ … ГДЕ Код = """ + КодПользователя + """";'
    лучше: 'Запрос.Текст = "… ГДЕ Т.Код = &Код"; Запрос.УстановитьПараметр("Код", КодПользователя);'
    почему: "Риск инъекции и поломки синтаксиса; нет плана-кэша."
    рекомендация: "Только параметры &Имя; динамику структуры — из белого списка полей metadata."

  - id: ansi_sql
    severity: medium
    title: "ANSI SQL вместо языка запросов 1С"
    match_scope: both
    detect:
      - '(?i)\bSELECT\b.+\bFROM\b'
      - '(?i)\bGROUP\s+BY\b'
      - '(?i)\bORDER\s+BY\b'
      - '(?i)\bINNER\s+JOIN\b'
    плохо: "SELECT * FROM Document.X WHERE …"
    лучше: "ВЫБРАТЬ … ИЗ Документ.<Имя> КАК Т ГДЕ … СГРУППИРОВАТЬ ПО … УПОРЯДОЧИТЬ ПО …"
    почему: "В 1С — свой язык: ВЫБРАТЬ/ИЗ/ГДЕ, не SELECT/JOIN SQL Server."
    рекомендация: "Переписать на 1С; функции: ЕСТЬNULL, ПРЕДСТАВЛЕНИЕ, ДАТАВРЕМЯ."

  - id: like_leading_percent
    severity: medium
    title: "ПОДОБНО с ведущим %"
    match_scope: query
    detect:
      - '(?i)ПОДОБНО\s+["'']%'
    плохо: 'ГДЕ Т.Наименование ПОДОБНО "%текст%"'
    лучше: 'ПОДОБНО "текст%" (если можно префикс) или полнотекст/отдельный индексный реквизит'
    почему: "Ведущий % часто отключает использование индекса."
    рекомендация: "По возможности префиксный поиск; иначе осознанный full scan."

  - id: vt_filter_outside
    severity: medium
    title: "Отбор виртуальной таблицы только снаружи"
    match_scope: query
    detect_all:
      - '(?i)Регистр(Накопления|Сведений)\.\w+\.(Остатки|Обороты|СрезПоследних|СрезПервых)\s*\('
      - '(?i)\bГДЕ\b'
    detect_none: []
    # уточнение в коде: пустые параметры ВТ ", )" или "(,)" рядом
    detect:
      - '(?i)\.(Остатки|Обороты|СрезПоследних|СрезПервых)\s*\(\s*&?\w*\s*,\s*\)'
      - '(?i)\.(Остатки|Обороты)\s*\(\s*,\s*\)'
    плохо: "ИЗ РегистрНакопления.<Имя>.Остатки(&Период, ) КАК Ост ГДЕ Ост.<Измерение> = &X"
    лучше: "ИЗ РегистрНакопления.<Имя>.Остатки(&Период, <Измерение> = &X) КАК Ост"
    почему: "Условие в параметрах ВТ сужает расчёт остатков/оборотов."
    рекомендация: "Перенести равенства по измерениям во 2-й параметр виртуальной таблицы."

  - id: presentation_in_where
    severity: medium
    title: "ПРЕДСТАВЛЕНИЕ / строка ссылки в ГДЕ"
    match_scope: query
    detect:
      - '(?i)ГДЕ[^\n]{0,200}ПРЕДСТАВЛЕНИЕ\s*\('
      - '(?i)ПРЕДСТАВЛЕНИЕ\s*\([^)]+\)\s*=\s*["'']'
    плохо: 'ГДЕ ПРЕДСТАВЛЕНИЕ(Т.Контрагент) = "ООО Ромашка"'
    лучше: "ГДЕ Т.Контрагент = &Контрагент  (ссылка); ПРЕДСТАВЛЕНИЕ — только в ВЫБРАТЬ"
    почему: "Нет нормального индекса; нестабильно при смене представления."
    рекомендация: "В отборе — ссылка/код; ПРЕДСТАВЛЕНИЕ только для вывода."

  - id: no_isnull_left_join
    severity: low
    title: "ЛЕВОЕ СОЕДИНЕНИЕ без ЕСТЬNULL на ресурсах"
    match_scope: query
    detect_all:
      - '(?i)ЛЕВОЕ\s+СОЕДИНЕНИЕ'
      - '(?i)\bСУММА\s*\(\s*[A-Za-zА-Яа-яЁё_]+\.'
    detect_none:
      - '(?i)ЕСТЬNULL\s*\('
    плохо: "ЛЕВОЕ СОЕДИНЕНИЕ … СУММА(Ост.КоличествоОстаток)"
    лучше: "СУММА(ЕСТЬNULL(Ост.КоличествоОстаток, 0))"
    почему: "NULL ломает суммы и сравнения."
    рекомендация: "Обернуть ресурсы/опциональные поля в ЕСТЬNULL."

  - id: dml_in_query
    severity: high
    title: "DML / чужой SQL в запросе 1С"
    match_scope: query
    detect:
      - '(?i)\b(INSERT|UPDATE|DELETE|DROP|TRUNCATE|MERGE)\b'
      - '(?i)\bУНИЧТОЖИТЬ\b'
    плохо: "DELETE FROM … / UPDATE …"
    лучше: "Только ВЫБРАТЬ; запись — через объекты/наборы записей BSL"
    почему: "Язык запросов 1С — выборка; DML через запрос недопустим/опасен."
    рекомендация: "Убрать DML; менять данные объектной моделью."

  - id: string_date_compare
    severity: medium
    title: "Дата как строка / без ДАТАВРЕМЯ"
    match_scope: query
    detect:
      - '(?i)Дата\s*(>=|<=|=|МЕЖДУ)\s*["'']\d{4}'
      - "(?i)МЕЖДУ\\s+['\\\"]\\d{4}-\\d{2}"
    плохо: "ГДЕ Т.Дата >= \"2015-01-01\""
    лучше: "ГДЕ Т.Дата МЕЖДУ ДАТАВРЕМЯ(2015,1,1,0,0,0) И ДАТАВРЕМЯ(2015,12,31,23,59,59) или &Начало/&Конец"
    почему: "Неверный тип; конец дня 23:59:59 часто забывают."
    рекомендация: "ДАТАВРЕМЯ или параметры даты из BSL (НачалоДня/КонецДня)."

  - id: missing_group_by
    severity: medium
    title: "Агрегат без СГРУППИРОВАТЬ ПО"
    match_scope: query
    detect_all:
      - '(?i)\b(СУММА|КОЛИЧЕСТВО|СРЕДНЕЕ|МИНИМУМ|МАКСИМУМ)\s*\('
      - '(?i)\bВЫБРАТЬ\b'
    detect_none:
      - '(?i)\bСГРУППИРОВАТЬ\s+ПО\b'
      - '(?i)\bИТОГИ\b'
    # если в SELECT только агрегаты — ок; эвристика: есть псевдоним поля без агрегата сложно —
    # помечаем medium с оговоркой
    плохо: "ВЫБРАТЬ Т.Контрагент, СУММА(Т.Сумма) … без СГРУППИРОВАТЬ ПО"
    лучше: "… СУММА(Т.Сумма) … СГРУППИРОВАТЬ ПО Т.Контрагент"
    почему: "Ошибка запроса или неверная семантика."
    рекомендация: "Все неагрегатные поля ВЫБРАТЬ → в СГРУППИРОВАТЬ ПО."

  - id: for_update_heavy
    severity: high
    title: "ДЛЯ ИЗМЕНЕНИЯ / тяжёлая блокировка в запросе"
    match_scope: both
    detect:
      - '(?i)ДЛЯ\s+ИЗМЕНЕНИЯ'
      - '(?i)FOR\s+UPDATE'
    плохо: "ВЫБРАТЬ … ИЗ … ДЛЯ ИЗМЕНЕНИЯ"
    лучше: "Управляемые блокировки БлокировкаДанных по измерениям; короткий участок"
    почему: "Долгие блокировки → ожидания и deadlock."
    рекомендация: "analyze_locks / recommend_managed_locks; сузить область блокировки."

  - id: register_table_not_virtual
    severity: medium
    title: "Прямое чтение таблицы регистра вместо виртуальной"
    match_scope: query
    detect:
      - '(?i)ИЗ\s+РегистрНакопления\.\w+\s+КАК\b'
      - '(?i)ИЗ\s+РегистрНакопления\.\w+\s+ГДЕ\b'
    detect_none:
      - '(?i)РегистрНакопления\.\w+\.(Остатки|Обороты|ОстаткиИОбороты)\s*\('
    плохо: "ИЗ РегистрНакопления.<Имя> КАК Движения ГДЕ …"
    лучше: "ИЗ РегистрНакопления.<Имя>.Остатки(&Период, …) / .Обороты(&Н, &К, …)"
    почему: "Остатки/обороты считаются платформой; сырые движения — другой смысл и часто тяжелее."
    рекомендация: "Для остатков/оборотов — виртуальные таблицы; сырые движения — только если нужны именно движения."

  - id: no_parameters_user_filter
    severity: low
    title: "Литералы вместо параметров (поддерживаемость)"
    match_scope: bsl
    detect:
      - '(?i)Запрос\s*\.\s*Текст\s*=\s*["''].{20,}["'']'
    # только hint; Python может понизить если есть УстановитьПараметр рядом
    detect_code: literal_query_hint
    плохо: 'Запрос.Текст = "… ГДЕ Дата МЕЖДУ ДАТАВРЕМЯ(2015,1,1,0,0,0) И …"'
    лучше: "… МЕЖДУ &Начало И &Конец + УстановитьПараметр"
    почему: "Сложнее переиспользовать; для динамических дат — только параметры."
    рекомендация: "Вынести периоды и ссылки в параметры (не ошибка, если константа осознанна)."
