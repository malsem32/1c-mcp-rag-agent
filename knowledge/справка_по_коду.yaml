# Справка по коду 1С (простой русский)

синонимы_тем:
  обзор: обзор
  код: код
  bsl: код
  цикл: код
  циклы: код
  for: код
  while: код
  основы: код
  best: практика
  запрос: запрос
  query: запрос
  выборка: выборка
  selection: выборка
  объект: объект
  object: объект
  регистр: регистр
  register: регистр
  форма: форма
  form: форма
  веб: веб
  http: веб
  ошибка: ошибка
  error: ошибка
  модуль: модуль
  module: модуль
  выгрузка: выгрузка
  export: выгрузка
  практика: практика

разделы:
  обзор:
    заголовок: Обзор
    текст: >
      Разделы: код, запрос, выборка, объект, регистр, форма, ошибка, модуль, практика.
      Имена Документ.X — только из поиска по вашей базе.
      Помощник только читает данные — не советуйте Записать/Удалить без просьбы.
      Синтаксис кода 1С — русский (Для, Пока, Если), не английский FOR/WHILE.
    пример: Справка по коду с темой «код» или вопросом «циклы в 1с»

  код:
    заголовок: Основы кода 1С (циклы, условия)
    текст: >
      Язык 1С (BSL) — ключевые слова по-русски.

      Условие: Если … Тогда … ИначеЕсли … Иначе … КонецЕсли.

      Цикл со счётчиком: Для Счётчик = 1 По 10 Цикл … КонецЦикла;
      (английское имя в справке: For — в коде пишем «Для», не FOR).

      Цикл по условию: Пока Условие Цикл … КонецЦикла;
      (в справке: While — в коде «Пока», не WHILE).

      Обход коллекции: Для Каждого Элемент Из Коллекция Цикл … КонецЦикла;
      (For each).

      Выход из цикла: Прервать;  Пропуск итерации: Продолжить;

      Попытка … Исключение … КонецПопытки.
      Функция / Процедура … КонецФункции / КонецПроцедуры.
      Истина / Ложь. Неопределено.

      Не использовать: FOR i = 1 TO n DO, WHILE, REPEAT…UNTIL, END — это не синтаксис 1С.
    пример: >
      Для Индекс = 1 По 5 Цикл Сообщить("Шаг " + Индекс); КонецЦикла;
      Пока Выборка.Следующий() Цикл Сумма = Сумма + Выборка.Сумма; КонецЦикла;
      Для Каждого Стр Из Таблица Цикл Сумма = Сумма + Стр.Сумма; КонецЦикла;

  запрос:
    заголовок: Запрос в коде
    текст: >
      Запрос = Новый Запрос; Запрос.Текст = "ВЫБРАТЬ …"; Запрос.УстановитьПараметр(...); Выборка = Запрос.Выполнить().Выбрать().
      Текст запроса — на языке 1С. Имена таблиц и полей — из метаданных базы.
    пример: Запрос = Новый Запрос; Запрос.Текст = "ВЫБРАТЬ ПЕРВЫЕ 100 Т.Ссылка КАК Ссылка, Т.Дата КАК Дата ИЗ Документ.<ИмяИзFindMetadata> КАК Т ГДЕ Т.Дата МЕЖДУ &Начало И &Конец И Т.Проведен"; Запрос.УстановитьПараметр("Начало", НачалоПериода); Запрос.УстановитьПараметр("Конец", КонецПериода); Выборка = Запрос.Выполнить().Выбрать();

  выборка:
    заголовок: Выборка результата
    текст: >
      Выборка = Результат.Выбрать(); Пока Выборка.Следующий() Цикл … КонецЦикла.
      Обращение к полям: Выборка.Номер, Выборка.Сумма (имена полей — из structure).
    пример: Выборка = Результат.Выбрать(); Пока Выборка.Следующий() Цикл // Выборка.<ПолеИзStructure> КонецЦикла;

  объект:
    заголовок: Ссылки и менеджеры
    текст: >
      Менеджеры: Справочники.Имя, Документы.Имя — Имя только из find_metadata текущей базы.
      НайтиПоНомеру, НайтиПоКоду — имена из конфигурации.
      Для чтения данных чаще удобнее запрос, чем обход ссылок.
    пример: Ссылка = Документы.<ИмяИзFindMetadata>.НайтиПоНомеру(Номер, Дата); Если ЗначениеЗаполнено(Ссылка) Тогда // … КонецЕсли;

  регистр:
    заголовок: Регистры
    текст: >
      В запросе: РегистрСведений.Имя.СрезПоследних, РегистрНакопления.Имя.Остатки / Обороты.
      Измерения и ресурсы — из structure объекта в вашей базе. Не копировать имена из примеров.
    пример: ВЫБРАТЬ Ост.<ИзмерениеИзStructure>, Ост.<РесурсИзStructure>Остаток ИЗ РегистрНакопления.<ИмяИзFindMetadata>.Остатки(&Момент, ) КАК Ост

  форма:
    заголовок: Формы
    текст: >
      НаКлиенте / НаСервере. Данные на сервере — через серверные процедуры и функции.
    пример: Функция ПолучитьДанныеНаСервере() // Запрос … Возврат Таблица; КонецФункции

  веб:
    заголовок: веб-сервис
    текст: >
      Обработчики получают запрос, читают тело, выполняют запрос 1С, возвращают ответ.
      Код сервиса агента — в расширении (модуль веб-сервиса).
    пример: Функция ОбработатьЗапрос(Запрос) Экспорт Тело = Запрос.ПолучитьТелоКакСтроку(); // разобрать, выполнить, вернуть КонецФункции

  ошибка:
    заголовок: Ошибки
    текст: >
      Попытка … Исключение … КонецПопытки.
      КраткоеПредставлениеОшибки(ИнформацияОбОшибке()).
    пример: Попытка Результат = Запрос.Выполнить(); Исключение Текст = КраткоеПредставлениеОшибки(ИнформацияОбОшибке()); КонецПопытки;

  модуль:
    заголовок: Модули
    текст: >
      Общий модуль, модуль объекта, модуль менеджера, модуль формы.
      Экспорт — доступ из других модулей.
    пример: Процедура СформироватьОтчет(НачалоПериода, КонецПериода) Экспорт // … КонецПроцедуры

  практика:
    заголовок: Практика
    текст: >
      1) Найти объект в базе. 2) Посмотреть реквизиты. 3) Написать ВЫБРАТЬ. 4) Не выдумывать имена.
      Для менеджера чаще хватает запроса, без сложного кода.
    пример: Запрос с СУММА(Т.СуммаДокумента) по периоду и Проведен = ИСТИНА

  выгрузка:
    заголовок: Выгрузка
    текст: >
      Для менеджера файл эксель делает помощник (если попросили выгрузку).
      В коде 1С — по задаче отдельно; имена полей из метаданных.
    пример: Сначала получить таблицу запросом, потом записать в файл по правилам конфигурации
