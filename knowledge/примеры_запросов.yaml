# Шаблоны ВЫБРАТЬ. Плейсхолдеры: {{документ}}, {{дата}}, {{сумма}}…
# Подставляются имена из вашей базы. Запрос — одной строкой.

поля_по_умолчанию:
  номер: Номер
  дата: Дата
  контрагент: Контрагент
  сумма: СуммаДокумента
  проведен: Проведен
  код: Код
  наименование: Наименование
  пометка_удаления: ПометкаУдаления
  номенклатура: Номенклатура
  количество: Количество
  сумма_строки: Сумма
  табличная_часть: Товары

шаблоны:
  - ид: документы_за_период
    когда: Список документов за месяц
    фраза: покажи реализации за февраль 2015
    шаблон: >
      ВЫБРАТЬ ПЕРВЫЕ 500 Т.{{номер}} КАК {{номер}}, Т.{{дата}} КАК {{дата}},
      ПРЕДСТАВЛЕНИЕ(Т.{{контрагент}}) КАК {{контрагент}}, Т.{{сумма}} КАК {{сумма}}, Т.{{проведен}} КАК {{проведен}}
      ИЗ {{документ}} КАК Т
      ГДЕ Т.{{дата}} МЕЖДУ ДАТАВРЕМЯ(2015,2,1,0,0,0) И ДАТАВРЕМЯ(2015,2,28,23,59,59)
      И Т.{{проведен}} = ИСТИНА УПОРЯДОЧИТЬ ПО Т.{{дата}}
    не_делать:
      - писать запрос как чужой язык запросов
      - разбивать запрос на несколько строк
      - выдумывать имя документа

  - ид: последние_документы
    когда: Последние документы
    фраза: покажи 10 последних реализаций
    шаблон: >
      ВЫБРАТЬ ПЕРВЫЕ 10 Т.{{номер}} КАК {{номер}}, Т.{{дата}} КАК {{дата}},
      ПРЕДСТАВЛЕНИЕ(Т.{{контрагент}}) КАК {{контрагент}}, Т.{{сумма}} КАК {{сумма}}
      ИЗ {{документ}} КАК Т ГДЕ Т.{{проведен}} = ИСТИНА УПОРЯДОЧИТЬ ПО Т.{{дата}} УБЫВ

  - ид: сумма_за_период
    когда: Сумма за период
    фраза: на какую сумму продажи за 2015
    шаблон: >
      ВЫБРАТЬ СУММА(Т.{{сумма}}) КАК Сумма, КОЛИЧЕСТВО(Т.Ссылка) КАК Количество
      ИЗ {{документ}} КАК Т
      ГДЕ Т.{{дата}} МЕЖДУ ДАТАВРЕМЯ(2015,1,1,0,0,0) И ДАТАВРЕМЯ(2015,12,31,23,59,59)
      И Т.{{проведен}} = ИСТИНА

  - ид: по_контрагентам
    когда: Суммы по контрагентам
    фраза: продажи по контрагентам за 2015
    шаблон: >
      ВЫБРАТЬ ПЕРВЫЕ 100 ПРЕДСТАВЛЕНИЕ(Т.{{контрагент}}) КАК {{контрагент}},
      СУММА(Т.{{сумма}}) КАК Сумма, КОЛИЧЕСТВО(Т.Ссылка) КАК Количество
      ИЗ {{документ}} КАК Т
      ГДЕ Т.{{дата}} МЕЖДУ ДАТАВРЕМЯ(2015,1,1,0,0,0) И ДАТАВРЕМЯ(2015,12,31,23,59,59)
      И Т.{{проведен}} = ИСТИНА
      СГРУППИРОВАТЬ ПО Т.{{контрагент}} УПОРЯДОЧИТЬ ПО Сумма УБЫВ

  - ид: справочник_список
    когда: Список из справочника
    фраза: список номенклатуры
    шаблон: >
      ВЫБРАТЬ ПЕРВЫЕ 50 Т.{{код}} КАК {{код}}, Т.{{наименование}} КАК {{наименование}}
      ИЗ {{справочник}} КАК Т ГДЕ Т.{{пометка_удаления}} = ЛОЖЬ

  - ид: строки_тч
    когда: Строки табличной части
    фраза: продажи по номенклатуре
    шаблон: >
      ВЫБРАТЬ ПЕРВЫЕ 200 ПРЕДСТАВЛЕНИЕ(Стр.{{номенклатура}}) КАК {{номенклатура}},
      СУММА(Стр.{{количество}}) КАК Количество, СУММА(Стр.{{сумма_строки}}) КАК Сумма
      ИЗ {{документ}}.{{табличная_часть}} КАК Стр
      ГДЕ Стр.Ссылка.{{дата}} МЕЖДУ ДАТАВРЕМЯ(2015,1,1,0,0,0) И ДАТАВРЕМЯ(2015,12,31,23,59,59)
      И Стр.Ссылка.{{проведен}} = ИСТИНА
      СГРУППИРОВАТЬ ПО Стр.{{номенклатура}} УПОРЯДОЧИТЬ ПО Сумма УБЫВ

правила:
  - Имя документа и справочника — только из поиска по вашей базе
  - Имена реквизитов — только из структуры объекта
  - Весь ВЫБРАТЬ — одной строкой
  - Для менеджера чаще достаточно построения отчёта, без ручного ВЫБРАТЬ
