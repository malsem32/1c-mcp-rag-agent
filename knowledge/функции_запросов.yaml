# Полный каталог функций языка запросов 1С
# Источник: конструктор запросов (дерево «Функции»).
# Имена объектов/полей в примерах — плейсхолдеры; брать из find_metadata/structure.

источник: "Конструктор запросов 1С — Функции языка запросов"

# --- Агрегатные (только с СГРУППИРОВАТЬ ПО / ИТОГИ) ---
агрегатные:
  - имя: СУММА
    сигнатура: "СУММА(<Выражение>)"
    когда: "сумма ресурса/реквизита, топы, итоги"
    пример: "СУММА(ЕСТЬNULL(Т.СуммаОборот, 0)) КАК Сумма"
  - имя: МИНИМУМ
    сигнатура: "МИНИМУМ(<Выражение>)"
    когда: "минимальная дата/цена"
  - имя: МАКСИМУМ
    сигнатура: "МАКСИМУМ(<Выражение>)"
    когда: "максимальная дата/сумма"
  - имя: СРЕДНЕЕ
    сигнатура: "СРЕДНЕЕ(<Выражение>)"
    когда: "средняя цена/маржа"
  - имя: КОЛИЧЕСТВО
    сигнатура: "КОЛИЧЕСТВО(<Выражение>) | КОЛИЧЕСТВО(*)"
    когда: "число строк/документов"
    пример: "КОЛИЧЕСТВО(Т.Ссылка) КАК Количество"
  - имя: КОЛИЧЕСТВО_РАЗЛИЧНЫЕ
    сигнатура: "КОЛИЧЕСТВО(РАЗЛИЧНЫЕ <Выражение>)"
    когда: "уникальные контрагенты/номенклатура"
    пример: "КОЛИЧЕСТВО(РАЗЛИЧНЫЕ Т.Контрагент) КАК УникКонтрагентов"

# --- Строки ---
строки:
  - имя: СТРОКА
    сигнатура: "СТРОКА(<Выражение>)"
    когда: "привести к строке"
  - имя: ДЛИНАСТРОКИ
    сигнатура: "ДЛИНАСТРОКИ(<Строка>)"
  - имя: ЛЕВ
    сигнатура: "ЛЕВ(<Строка>, <Число>)"
  - имя: ПРАВ
    сигнатура: "ПРАВ(<Строка>, <Число>)"
  - имя: ВРЕГ
    сигнатура: "ВРЕГ(<Строка>)"
  - имя: НРЕГ
    сигнатура: "НРЕГ(<Строка>)"
  - имя: ПОДСТРОКА
    сигнатура: "ПОДСТРОКА(<Строка>, <Начало>, <Длина>)"
    когда: "префикс номера, разбор кода"
    пример: "ПОДСТРОКА(Т.Номер, 1, 5) КАК Префикс"
  - имя: СОКРЛ
    сигнатура: "СОКРЛ(<Строка>)"
  - имя: СОКРП
    сигнатура: "СОКРП(<Строка>)"
  - имя: СОКРЛП
    сигнатура: "СОКРЛП(<Строка>)"
  - имя: СТРНАЙТИ
    сигнатура: "СТРНАЙТИ(<Строка>, <Подстрока>)"
  - имя: СТРЗАМЕНИТЬ
    сигнатура: "СТРЗАМЕНИТЬ(<Строка>, <Что>, <НаЧто>)"

# --- Даты ---
даты:
  - имя: ГОД
    сигнатура: "ГОД(<Дата>)"
  - имя: КВАРТАЛ
    сигнатура: "КВАРТАЛ(<Дата>)"
  - имя: МЕСЯЦ
    сигнатура: "МЕСЯЦ(<Дата>)"
  - имя: ДЕНЬГОДА
    сигнатура: "ДЕНЬГОДА(<Дата>)"
  - имя: ДЕНЬ
    сигнатура: "ДЕНЬ(<Дата>)"
  - имя: НЕДЕЛЯ
    сигнатура: "НЕДЕЛЯ(<Дата>)"
  - имя: ДЕНЬНЕДЕЛИ
    сигнатура: "ДЕНЬНЕДЕЛИ(<Дата>)"
  - имя: ЧАС
    сигнатура: "ЧАС(<Дата>)"
  - имя: МИНУТА
    сигнатура: "МИНУТА(<Дата>)"
  - имя: СЕКУНДА
    сигнатура: "СЕКУНДА(<Дата>)"
  - имя: НАЧАЛОПЕРИОДА
    сигнатура: "НАЧАЛОПЕРИОДА(<Дата>, <ТипПериода>)"
    когда: "группировка помесячно/по кварталам; с .Обороты(…, Месяц, )"
    типы_периода: [СЕКУНДА, МИНУТА, ЧАС, ДЕНЬ, НЕДЕЛЯ, МЕСЯЦ, КВАРТАЛ, ГОД, ДЕКАДА, ПОЛУГОДИЕ]
    пример: "НАЧАЛОПЕРИОДА(Т.Период, МЕСЯЦ) КАК Период"
  - имя: КОНЕЦПЕРИОДА
    сигнатура: "КОНЕЦПЕРИОДА(<Дата>, <ТипПериода>)"
    когда: "конец месяца/года в отборе или колонке"
  - имя: ДОБАВИТЬКДАТЕ
    сигнатура: "ДОБАВИТЬКДАТЕ(<Дата>, <Тип>, <Число>)"
    когда: "дата+N дней/месяцев (read-only; не путать с DML ДОБАВИТЬ)"
    пример: "ДОБАВИТЬКДАТЕ(Т.Дата, ДЕНЬ, 7) КАК Срок"
  - имя: РАЗНОСТЬДАТ
    сигнатура: "РАЗНОСТЬДАТ(<Дата1>, <Дата2>, <Тип>)"
    когда: "срок в днях, просрочка"
    пример: "РАЗНОСТЬДАТ(Т.Дата, &ТекущаяДата, ДЕНЬ) КАК Дней"

# --- Числа (редко для менеджерских отчётов) ---
числа:
  - имя: ACOS
  - имя: ASIN
  - имя: ATAN
  - имя: COS
  - имя: TAN
  - имя: SIN
  - имя: EXP
  - имя: LOG
  - имя: LOG10
  - имя: POW
  - имя: SQRT
  - имя: ОКР
    сигнатура: "ОКР(<Число>, <Разрядность>)"
    когда: "округление суммы/цены"
  - имя: ЦЕЛ
    сигнатура: "ЦЕЛ(<Число>)"

# --- Прочие функции ---
прочие_функции:
  - имя: ЕСТЬNULL
    сигнатура: "ЕСТЬNULL(<Выражение>, <Замена>)"
    когда: "остатки/обороты/join — почти всегда"
    пример: "ЕСТЬNULL(Т.СуммаОстаток, 0) КАК СуммаОстаток"
  - имя: ПРЕДСТАВЛЕНИЕ
    сигнатура: "ПРЕДСТАВЛЕНИЕ(<Ссылка>)"
    когда: "ссылки в таблице для менеджера"
    пример: "ПРЕДСТАВЛЕНИЕ(Т.Контрагент) КАК Контрагент"
  - имя: ПРЕДСТАВЛЕНИЕССЫЛКИ
    сигнатура: "ПРЕДСТАВЛЕНИЕССЫЛКИ(<Ссылка>)"
  - имя: ТИПЗНАЧЕНИЯ
    сигнатура: "ТИПЗНАЧЕНИЯ(<Выражение>)"
  - имя: АВТОНОМЕРЗАПИСИ
    сигнатура: "АВТОНОМЕРЗАПИСИ()"
  - имя: РАЗМЕРХРАНИМЫХДАННЫХ
    сигнатура: "РАЗМЕРХРАНИМЫХДАННЫХ(<Выражение>)"
  - имя: УНИКАЛЬНЫЙИДЕНТИФИКАТОР
    сигнатура: "УНИКАЛЬНЫЙИДЕНТИФИКАТОР(<Ссылка>)"
    когда: "нужен UID строки/ссылки"

# --- Операторы (не функции, но часть языка) ---
арифметика: ["+", "-", "*", "/"]

логика:
  сравнение: ["=", "<>", "<", "<=", ">", ">="]
  булевы: [И, ИЛИ, НЕ]
  спец:
    - имя: ПОДОБНО
      пример: 'Т.Наименование ПОДОБНО "%текст%"'
    - имя: В
      пример: "Т.Статус В (&Список)"
    - имя: В_ИЕРАРХИИ
      сигнатура: "В ИЕРАРХИИ"
    - имя: МЕЖДУ
      пример: "Т.Дата МЕЖДУ ДАТАВРЕМЯ(г,м,д,0,0,0) И ДАТАВРЕМЯ(г,м,д,23,59,59)"
    - имя: ЕСТЬ_NULL
      сигнатура: "ЕСТЬ NULL"
    - имя: ССЫЛКА
      сигнатура: "ССЫЛКА Документ.X / Справочник.Y"

прочие_операторы:
  - имя: ВЫБОР
    сигнатура: "ВЫБОР КОГДА … ТОГДА … ИНАЧЕ … КОНЕЦ"
    когда: "условия в SELECT, флаги, корзины"
    пример: "ВЫБОР КОГДА Т.СуммаОстаток > 0 ТОГДА \"Долг\" ИНАЧЕ \"0\" КОНЕЦ"
  - имя: ВЫРАЗИТЬ
    сигнатура: "ВЫРАЗИТЬ(<Выражение> КАК <Тип>)"
    когда: "приведение типа, составные ссылки"
    пример: "ВЫРАЗИТЬ(Т.Номер КАК СТРОКА(20))"

конструкторы:
  - имя: ДАТАВРЕМЯ
    сигнатура: "ДАТАВРЕМЯ(Год, Месяц, День, Час, Мин, Сек)"
    когда: "всегда для дат в WHERE/параметрах вирт.таблиц"
  - имя: ЗНАЧЕНИЕ
    сигнатура: "ЗНАЧЕНИЕ(Перечисление.Имя.Значение | Справочник.Имя.Предопределенный)"
  - имя: ТИП
    сигнатура: "ТИП(Документ.X) / ТИП(\"Строка\")"
  - имя: СГРУППИРОВАНОПО
    сигнатура: "СГРУППИРОВАНОПО(<Поле>)"
    когда: "с СГРУППИРОВАТЬ ПО ГРУППИРУЮЩИМ НАБОРАМ"

# Что builders агента ставят по умолчанию (менеджерские отчёты)
приоритет_builders:
  почти_всегда:
    - ПРЕДСТАВЛЕНИЕ
    - ЕСТЬNULL
    - СУММА
    - КОЛИЧЕСТВО
    - ДАТАВРЕМЯ
    - МЕЖДУ
    - УПОРЯДОЧИТЬ_ПО  # конструкция, не функция
    - СГРУППИРОВАТЬ_ПО
  остатки_обороты:
    - Остатки
    - Обороты
    - СрезПоследних
    - НАЧАЛОПЕРИОДА
    - КОНЕЦПЕРИОДА
  связки:
    - ЛЕВОЕ_СОЕДИНЕНИЕ
    - ВНУТРЕННЕЕ_СОЕДИНЕНИЕ
  по_запросу:
    - ИТОГИ
    - МАКСИМУМ
    - МИНИМУМ
    - СРЕДНЕЕ
    - КОЛИЧЕСТВО_РАЗЛИЧНЫЕ
    - ВЫБОР
    - ВЫРАЗИТЬ
    - ПОДСТРОКА
    - ГОД
    - МЕСЯЦ
    - КВАРТАЛ
    - ДОБАВИТЬКДАТЕ
    - РАЗНОСТЬДАТ
    - ОКР
    - УНИКАЛЬНЫЙИДЕНТИФИКАТОР
    - ЗНАЧЕНИЕ

правила:
  - "Только синтаксис 1С — не ANSI SQL (нет ISNULL/LEFT JOIN как в T-SQL)."
  - "Имена таблиц/полей — только из structure текущей базы."
  - "Для ссылок в SELECT — ПРЕДСТАВЛЕНИЕ; в WHERE — само поле."
  - "Для вирт.таблиц ресурсов: РесурсОстаток / РесурсОборот + ЕСТЬNULL(..., 0)."
  - "ДОБАВИТЬКДАТЕ — легальная функция; DML «ДОБАВИТЬ» в запросах запрещён."
  - "ПОМЕСТИТЬ через HTTP-пакет «;» обычно недоступен — JOIN виртуальных таблиц."
