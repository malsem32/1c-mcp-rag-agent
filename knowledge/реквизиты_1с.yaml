# Реквизиты 1С — подсказки для поиска полей в метаданных.
#
# В запросе 1С (имена — только из structure ЭТОЙ базы):
#   ВЫБРАТЬ Т.Дата, Т.<СуммаИзStructure>, ПРЕДСТАВЛЕНИЕ(Т.<КонтрагентИзStructure>) КАК Контрагент
#   ИЗ Документ.<ИмяИзFindMetadata> КАК Т
#
# «искать_по» — кандидаты стем для поиска в Имени/Синониме реквизита.
# Реальное имя берётся из базы (get_object_structure). Не hardcode full_name.

шапка_документа:
  - дата
  - номер
  - проведен
  - организация
  - контрагент
  - договор
  - склад
  - сумма
  - валюта
  - ответственный
  - комментарий
  - статус

реквизиты:
  номер:
    что_это: "Номер документа"
    в_запросе: "Т.Номер"
    искать_по:
      - Номер
      - номер

  дата:
    что_это: "Дата документа"
    в_запросе: "Т.Дата"
    искать_по:
      - Дата
      - дата

  проведен:
    что_это: "Документ проведён"
    в_запросе: "Т.Проведен = ИСТИНА"
    искать_по:
      - Проведен
      - проведен

  пометка_удаления:
    что_это: "Пометка удаления"
    в_запросе: "Т.ПометкаУдаления = ЛОЖЬ"
    искать_по:
      - ПометкаУдаления
      - пометка удаления

  сумма:
    что_это: "Сумма документа (часто СуммаДокумента)"
    в_запросе: "СУММА(Т.СуммаДокумента)"
    искать_по:
      - СуммаДокумента
      - СуммаВсего
      - СуммаОплаты
      - СуммаСНДС
      - СуммаВзаиморасчетов
      - Сумма
      - Итого
      - Итог

  контрагент:
    что_это: "Контрагент (ссылка; в запросе часто ПРЕДСТАВЛЕНИЕ)"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Т.Контрагент) КАК Контрагент"
    искать_по:
      - Контрагент
      - Партнер
      - Партнёр
      - Клиент
      - Покупатель
      - Заказчик
      - Поставщик
      - Грузополучатель
      - Грузоотправитель

  организация:
    что_это: "Наша организация"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Т.Организация)"
    искать_по:
      - Организация
      - ОрганизацияОтправитель
      - ОрганизацияПолучатель

  склад:
    что_это: "Склад"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Т.Склад)"
    искать_по:
      - Склад
      - СкладОтправитель
      - СкладПолучатель

  договор:
    что_это: "Договор"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Т.Договор)"
    искать_по:
      - Договор
      - Соглашение
      - Контракт

  валюта:
    что_это: "Валюта"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Т.Валюта)"
    искать_по:
      - Валюта

  ответственный:
    что_это: "Ответственный или менеджер"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Т.Ответственный)"
    искать_по:
      - Ответственный
      - Менеджер
      - Автор
      - Сотрудник

  комментарий:
    что_это: "Комментарий"
    в_запросе: "Т.Комментарий"
    искать_по:
      - Комментарий
      - Примечание
      - Описание

  статус:
    что_это: "Статус документа"
    в_запросе: "Т.Статус"
    искать_по:
      - Статус
      - Состояние

  код:
    что_это: "Код элемента справочника"
    в_запросе: "Т.Код"
    искать_по:
      - Код

  наименование:
    что_это: "Наименование в справочнике"
    в_запросе: "Т.Наименование"
    искать_по:
      - Наименование
      - Название

  артикул:
    что_это: "Артикул"
    в_запросе: "Т.Артикул"
    искать_по:
      - Артикул

  инн:
    что_это: "ИНН"
    в_запросе: "Т.ИНН"
    искать_по:
      - ИНН

  кпп:
    что_это: "КПП"
    в_запросе: "Т.КПП"
    искать_по:
      - КПП

  это_группа:
    что_это: "Группа (папка) в справочнике"
    в_запросе: "Т.ЭтоГруппа = ЛОЖЬ"
    искать_по:
      - ЭтоГруппа

  номенклатура:
    что_это: "Номенклатура в строке табличной части"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Стр.Номенклатура)"
    искать_по:
      - Номенклатура
      - Товар
      - Услуга
      - Продукция
      - Материал

  количество:
    что_это: "Количество в строке"
    в_запросе: "СУММА(Стр.Количество)"
    искать_по:
      - Количество

  цена:
    что_это: "Цена в строке"
    в_запросе: "Стр.Цена"
    искать_по:
      - Цена
      - Стоимость

  подразделение:
    что_это: "Подразделение"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Т.Подразделение)"
    искать_по:
      - Подразделение
      - Отдел

  сделка:
    что_это: "Сделка или проект"
    в_запросе: "ПРЕДСТАВЛЕНИЕ(Т.Сделка)"
    искать_по:
      - Сделка
      - Проект

  ндс:
    что_это: "НДС"
    в_запросе: "Т.СуммаНДС"
    искать_по:
      - СуммаНДС
      - НДС
      - СтавкаНДС

  оплата:
    что_это: "Поля шапки про оплату (имя — только из structure этой базы)"
    в_запросе: "Т.<имя_из_structure>"
    искать_по:
      - оплат
      - ожида

  ожидаемая_дата:
    что_это: "Дата «ожидается / срок» в шапке"
    в_запросе: "Т.<имя_из_structure>"
    искать_по:
      - ожида
      - срок

