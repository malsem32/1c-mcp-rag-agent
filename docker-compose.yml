# Qdrant для 1C RAG Agent (server mode — быстрее local path на 70k+ points)
# Запуск:  docker compose up -d
# UI:      http://localhost:6333/dashboard
# config.yaml -> qdrant.mode: url
#
# ВАЖНО: хранилище — именованный docker-том, НЕ папка Windows (bind mount).
# На bind mount из Windows (Docker Desktop) векторы со временем превращались в нулевые:
# поиск по смыслу молча не работал (проверено: 60-75% точек обнулялись, исправленные — снова).
# Docker-том (ext4 внутри VM Docker) такой проблемы не даёт.

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    # 0 = все ядра хоста на поиск и API
    environment:
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "0"
      QDRANT__STORAGE__PERFORMANCE__OPTIMIZER_CPU_BUDGET: "0"
      QDRANT__SERVICE__MAX_WORKERS: "0"

volumes:
  qdrant_storage:
    name: rag_qdrant_vol
